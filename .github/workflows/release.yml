# Publish a release: a universal Magpie.dmg (Apple silicon and Intel) and,
# once the signing secret exists, the updater files. Push a tag like v0.1.0,
# or run this workflow by hand with the version (it creates the tag).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.1.0. Must match app/src-tauri/tauri.conf.json.
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # The sorting model ships inside the app; the build fails rather than ship without it.
      - run: node scripts/fetch-model.ts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx tauri
          args: --target universal-apple-darwin
          tagName: ${{ env.TAG }}
          releaseName: Magpie ${{ env.TAG }}
          releaseBody: "First time opening it? macOS will warn you because Magpie is not notarized yet. Open System Settings › Privacy & Security and click Open Anyway. Details: https://magpie.gmfoster.com/#first-open"
          releaseDraft: false
          includeUpdaterJson: true
      # A name that never changes, so the website's Download button always gets the newest build.
      - name: Upload Magpie.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Magpie.dmg
          gh release upload "$TAG" Magpie.dmg --clobber
