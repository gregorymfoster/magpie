[package]
name = "magpie"
version = "0.1.5"
description = "A calm ebook manager for the Mac that fixes the books you already have."
license = "MIT"
repository = "https://github.com/gregorymfoster/magpie"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Built for speed of building: the Rust side is a thin host (the core is TypeScript), so LTO
# and one codegen unit bought a few hundred KB and cost minutes on every release. Incremental
# keeps a warm `just ship` to the files that changed (docs/release.md).
[profile.release]
codegen-units = 256
incremental = true
lto = false
opt-level = 2
panic = "abort"
strip = true
