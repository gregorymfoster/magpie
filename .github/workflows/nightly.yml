# Formal verification, every night, deeper than `just check` can afford on each push:
# the Undo model at bigger bounds, and the property tests with many more cases and
# a fresh random seed each night (`just verify-deep`). A failure opens an issue
# (or comments on the open one) with the run's log, which carries the seed and the
# shortest case fast-check found. The verify-* skills in .claude/skills say how to read one.
name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: extractions/setup-just@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: verify/.tla
          key: tla-${{ hashFiles('scripts/verify.ts') }}
      - run: npm ci
      - run: just verify-deep 2>&1 | tee nightly.log
        shell: bash -o pipefail {0}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
      - name: Flag the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The nightly verification failed on $(git rev-parse --short HEAD): $RUN

          The log names the property, the seed and the shortest failing case. Read it with the matching verify-* skill in .claude/skills."
          open=$(gh issue list --state open --label nightly --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else
            gh label create nightly --color B60205 --description "The nightly verification run failed" 2>/dev/null || true
            gh issue create --title "Nightly verification failed" --label nightly --body "$body"
          fi
