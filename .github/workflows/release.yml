# Backup only: releases are built on Greg's Mac with `just ship X.Y.Z` (docs/release.md), which
# is several times faster. This builds a universal Magpie.dmg (Apple silicon and Intel) on a
# GitHub runner instead, with the updater files once scripts/release/setup.sh has stored the key.
# Run it by hand with the version. No tag trigger: `just ship` creates tags, and a second build
# racing it would overwrite its latest.json.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0 (newer than the latest release).
        required: true

env:
  TAG: v${{ inputs.version }}

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # The sorting model ships inside the app; the build fails rather than ship without it.
      - run: node scripts/fetch-model.ts
      # Release-only config, as in scripts/release/ship.sh: the version from the input, and the
      # updater key and update bundle only when setup.sh has stored the key.
      - name: Release config
        env:
          VERSION: ${{ inputs.version }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e '
            const v = process.env.VERSION, k = process.env.PUBKEY;
            const c = { version: v };
            if (k) Object.assign(c, { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: k } } });
            console.log(JSON.stringify(c));' > "$RUNNER_TEMP/release.conf.json"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx tauri
          args: --target universal-apple-darwin --config ${{ runner.temp }}/release.conf.json
          tagName: ${{ env.TAG }}
          releaseName: Magpie ${{ env.TAG }}
          releaseBody: "First time opening it? macOS will warn you because Magpie is not notarized yet. Open System Settings › Privacy & Security and click Open Anyway. Details: https://magpie.gmfoster.com/#first-open"
          releaseDraft: false
          includeUpdaterJson: true
      # A name that never changes, so the website's Download button always gets the newest build.
      - name: Upload Magpie.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Magpie.dmg
          gh release upload "$TAG" Magpie.dmg --clobber
